name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 lua-check
      - name: Lint
        run: luacheck .
      - name: Test
        run: lua Tests/test_logic.lua
